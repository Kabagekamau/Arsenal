.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}

.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.mgr{text-align:center;color:var(--mute);font:14px system-ui,sans-serif;margin-top:14px}
.mgr b{color:var(--ink)}

.t{background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:center;padding:16px 10px}
.t svg{width:64px;height:80px}.t b{display:block;margin-top:8px}.t span{color:var(--mute);font:13px system-ui,sans-serif}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}

.s b{display:block;font-size:38px;color:var(--red)}.s span{font:12px system-ui,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.pitch{position:relative;aspect-ratio:3/4;max-height:640px;width:100%;margin:0 auto;border-radius:16px;overflow:hidden;
background:repeating-linear-gradient(#2e8b47 0 10%,#339c50 10% 20%);border:3px solid #fff}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffffaa}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid #ffffffaa;border-radius:50%;transform:translate(-50%,-50%)}
.p{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:2;width:22%}
.p i{display:block;width:clamp(30px,8vw,46px);height:clamp(30px,8vw,46px);margin:0 auto 3px;border-radius:50%;background:var(--red);border:2px solid #fff;color:#fff;font:700 clamp(11px,3vw,16px)/clamp(26px,7vw,42px) system-ui,sans-serif;font-style:normal}
.p span{font:600 clamp(10px,2.6vw,13px) system-ui,sans-serif;color:#fff;text-shadow:0 1px 3px #000}
.me i{background:var(--gold);color:#000;box-shadow:0 0 0 4px #ffd95a88}
.me span{color:#ffe27a}
.subs{display:flex;flex-wrap:wrap;gap:8px}
.subs div{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:14px system-ui,sans-serif}
.subs b{color:var(--red);margin-right:6px}
.note{color:var(--mute);font:13px system-ui,sans-serif;text-align:center;margin-top:10px}
table{width:100%;border-collapse:collapse;font:15px system-ui,sans-serif;background:var(--card);border-radius:12px;overflow:hidden}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
footer{margin-top:30px;text-align:center;color:var(--mute);font:12px system-ui,sans-serif}
